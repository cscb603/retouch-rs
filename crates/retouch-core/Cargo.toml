[package]
name = "retouch-core"
version = "0.2.1"
edition = "2021"

[lib]
name = "retouch_core"
path = "src/lib.rs"

[dependencies]
image = "0.25"
palette = "0.7"
zentone = "0.1.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 导出模块：JPEG 段级 EXIF 保留（mmap 读取源文件 APP1 标记）
memmap2 = "0.9"
inpaint = "0.1.7"
ndarray = "0.16.1"
log = "0.4"

# v0.6.6 导出画质升级（纯 Rust，零 C 依赖；Win 交叉编译无影响）
mozjpeg-rs = "0.9.2"        # MozJPEG 编码：S444 无 chroma 下采样 + progressive + Huffman 优化
fast_image_resize = "6.0"   # SIMD 重采样，替 image::resize_exact（Lanczos3）

[features]
default = []
