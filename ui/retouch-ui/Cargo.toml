[package]
name = "retouch-ui"
version = "0.6.6"
edition = "2021"

[[bin]]
name = "retouch-rs-gui"
path = "src/main.rs"

[features]
default = ["qwen"]
qwen = ["retouch-agent"]

[dependencies]
retouch-core = { path = "../../crates/retouch-core" }
retouch-agent = { path = "../../crates/retouch-agent", optional = true }
egui = "0.29"
eframe = { version = "0.29", features = ["glow"] }
rfd = "0.15"
image = "0.25"
palette = "0.7"
serde_json = "1"

[dev-dependencies]
ttf-parser = "0.25"
